<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prospects | Built by Davila</title><link rel="stylesheet" href="studio.css"><style>body{background:#f5f5f2}.wrap{max-width:1250px;margin:0 auto;padding:34px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:22px}.top h1{margin:4px 0}.summary{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}.metric{background:#fff;border:1px solid #e5e5e2;border-radius:14px;padding:12px 16px;min-width:155px}.metric span{display:block;font-size:10px;font-weight:800;color:#667085;text-transform:uppercase;letter-spacing:.08em}.metric strong{font-size:24px}.panel{background:#fff;border:1px solid #e5e5e2;border-radius:18px;overflow:hidden}.row{display:grid;grid-template-columns:1.4fr 1fr .9fr .8fr auto;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid #efefed}.row.head{font-size:11px;font-weight:800;text-transform:uppercase;color:#667085}.row:last-child{border-bottom:0}.name{font-weight:800}.muted{color:#667085;font-size:12px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#fff1cc;color:#8a5b00;font-size:11px;font-weight:800}.empty{padding:34px;text-align:center;color:#667085}.drawer{margin-top:18px;background:#fff;border:1px solid #e5e5e2;border-radius:18px;padding:22px;display:none}.drawer.on{display:block}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.box{background:#f7f7f5;border-radius:12px;padding:14px}.draft{margin-top:16px;border:1px solid #e5e5e2;border-radius:16px;overflow:hidden}.draft-hero{padding:34px;background:#111;color:#fff}.draft-hero h2{font-size:36px;margin:8px 0}.draft-section{padding:24px}.actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:800px){.row{grid-template-columns:1fr}.row.head{display:none}.two{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div><div class="eyebrow">BUILT BY DAVILA • PROSPECTS</div><h1>Website Prospects</h1><div class="studio-welcome">Review website intake submissions and generate a private first-draft concept before the prospect sees anything.</div></div><div class="toolbar"><a class="btn secondary" href="studio.html">Back to Studio</a><a class="btn primary" href="prospect-intake.html" target="_blank">Open Intake Form</a></div></div><div class="summary"><div class="metric"><span>Total Prospects</span><strong id="total">0</strong></div><div class="metric"><span>New Intakes</span><strong id="new">0</strong></div><div class="metric"><span>Drafts Generated</span><strong id="drafts">0</strong></div></div><div class="panel"><div class="row head"><div>Prospect</div><div>Goal</div><div>Style</div><div>Status</div><div>Action</div></div><div id="list"></div></div><div class="drawer" id="drawer"></div></main><script>const KEY='bbd_prospect_intakes_v1';let data=JSON.parse(localStorage.getItem(KEY)||'[]');const esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(data))}function render(){document.getElementById('total').textContent=data.length;document.getElementById('new').textContent=data.filter(x=>x.status==='New Intake').length;document.getElementById('drafts').textContent=data.filter(x=>x.draftGenerated).length;const list=document.getElementById('list');if(!data.length){list.innerHTML='<div class="empty">No prospect intakes yet. Open the intake form to test the workflow.</div>';return}list.innerHTML=data.map(x=>`<div class="row"><div><div class="name">${esc(x.company)}</div><div class="muted">${esc(x.contact)} • ${esc(x.email)}</div></div><div>${esc(x.goal||'—')}</div><div>${esc(x.style||'—')}</div><div><span class="pill">${esc(x.status)}</span></div><div><button class="btn secondary" onclick="openProspect('${x.id}')">Open</button></div></div>`).join('')}function generateDraft(x){const headline=x.goal==='Generate leads'?`A better way to choose ${x.business?x.company:'your next partner'}.`:`${x.company}, built to stand out.`;const sub=x.business||`A modern website concept for ${x.company}.`;return{headline,sub,cta:x.cta||'Get Started',sections:['About',...(x.pages||[]).filter(p=>p!=='Home'&&p!=='About'),'Contact'],createdAt:new Date().toISOString()}}window.openProspect=id=>{const x=data.find(p=>p.id===id);if(!x)return;const d=x.draft||null;document.getElementById('drawer').className='drawer on';document.getElementById('drawer').innerHTML=`<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><div class="eyebrow">PROSPECT INTAKE</div><h2 style="margin:5px 0">${esc(x.company)}</h2><div class="muted">Submitted ${new Date(x.submittedAt).toLocaleString()}</div></div><div class="actions"><button class="btn primary" onclick="makeDraft('${x.id}')">${d?'Regenerate Draft':'Generate Private Draft'}</button></div></div><div class="two" style="margin-top:16px"><div class="box"><strong>Business</strong><div class="muted" style="margin-top:6px">${esc(x.business||'—')}</div></div><div class="box"><strong>Ideal customer</strong><div class="muted" style="margin-top:6px">${esc(x.audience||'—')}</div></div><div class="box"><strong>Goal</strong><div class="muted" style="margin-top:6px">${esc(x.goal||'—')}</div></div><div class="box"><strong>Style</strong><div class="muted" style="margin-top:6px">${esc(x.style||'—')} • ${esc(x.colors||'No colors provided')}</div></div></div>${d?draftHtml(x,d):'<div class="empty">No private website draft generated yet.</div>'}`;document.getElementById('drawer').scrollIntoView({behavior:'smooth'})};function draftHtml(x,d){return`<div class="draft"><div class="draft-hero"><div class="eyebrow" style="color:#ff735f">PRIVATE INTERNAL DRAFT</div><h2>${esc(d.headline)}</h2><p>${esc(d.sub)}</p><button class="btn primary">${esc(d.cta)}</button></div><div class="draft-section"><strong>Suggested site structure</strong><div class="muted" style="margin-top:7px">${d.sections.map(esc).join(' • ')}</div><p style="margin-top:18px"><strong>Design direction:</strong> ${esc(x.style||'Modern & clean')}${x.colors?' using '+esc(x.colors):''}.</p><p><strong>Content direction:</strong> Focus on ${esc(x.goal||'credibility')}, speak directly to ${esc(x.audience||'the target customer')}, and drive visitors toward “${esc(d.cta)}.”</p><div class="muted">This draft is visible only in your Built by Davila workbench.</div></div></div>`}window.makeDraft=id=>{const x=data.find(p=>p.id===id);if(!x)return;x.draft=generateDraft(x);x.draftGenerated=true;x.status='Draft Generated';save();render();openProspect(id)};render();</script></body></html>
