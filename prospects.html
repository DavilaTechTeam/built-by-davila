<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prospects | Built by Davila</title><link rel="stylesheet" href="studio.css"><style>
body{background:#f5f5f2}.wrap{max-width:1250px;margin:0 auto;padding:34px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:22px}.top h1{margin:4px 0}.summary{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}.metric{background:#fff;border:1px solid #e5e5e2;border-radius:14px;padding:12px 16px;min-width:155px}.metric span{display:block;font-size:10px;font-weight:800;color:#667085;text-transform:uppercase;letter-spacing:.08em}.metric strong{font-size:24px}.panel{background:#fff;border:1px solid #e5e5e2;border-radius:18px;overflow:hidden}.row{display:grid;grid-template-columns:1.4fr 1fr .9fr .8fr auto;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid #efefed}.row.head{font-size:11px;font-weight:800;text-transform:uppercase;color:#667085}.row:last-child{border-bottom:0}.name{font-weight:800}.muted{color:#667085;font-size:12px;line-height:1.5}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#fff1cc;color:#8a5b00;font-size:11px;font-weight:800}.pill.draft{background:#dcfce7;color:#166534}.empty{padding:34px;text-align:center;color:#667085}.drawer{margin-top:18px;background:#fff;border:1px solid #e5e5e2;border-radius:18px;padding:22px;display:none}.drawer.on{display:block}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.box{background:#f7f7f5;border-radius:12px;padding:14px}.draft{margin-top:16px;border:1px solid #e5e5e2;border-radius:16px;overflow:hidden}.draft-hero{padding:38px;background:#111;color:#fff}.draft-hero h2{font-size:38px;margin:8px 0 12px;max-width:850px}.draft-hero p{max-width:800px;line-height:1.6;color:#e5e7eb}.draft-section{padding:24px;border-top:1px solid #ececea}.draft-section h3{margin:0 0 14px}.concept-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.concept-card{border:1px solid #e5e5e2;border-radius:13px;padding:14px;background:#fafaf8}.concept-card strong{display:block;margin-bottom:6px}.site-map{display:flex;gap:8px;flex-wrap:wrap}.site-chip{background:#f1f1ee;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700}.copy-block{background:#f7f7f5;border-radius:12px;padding:14px;margin-top:10px}.copy-block .label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#667085;font-weight:800;margin-bottom:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.error{padding:18px;color:#b42318}.loading{padding:34px;text-align:center;color:#667085}@media(max-width:800px){.row{grid-template-columns:1fr}.row.head{display:none}.two,.concept-grid{grid-template-columns:1fr}.top{flex-direction:column}}
</style></head><body><main class="wrap"><div class="top"><div><div class="eyebrow">BUILT BY DAVILA • PROSPECTS</div><h1>Website Prospects</h1><div class="studio-welcome">Review intake submissions and build a private website concept before the prospect sees anything.</div></div><div class="toolbar"><a class="btn secondary" href="studio.html">Back to Studio</a><button class="btn secondary" id="refresh">Refresh</button><a class="btn primary" href="prospect-intake.html" target="_blank">Open Intake Form</a></div></div><div class="summary"><div class="metric"><span>Total Prospects</span><strong id="total">0</strong></div><div class="metric"><span>New Intakes</span><strong id="new">0</strong></div><div class="metric"><span>Drafts Generated</span><strong id="drafts">0</strong></div></div><div class="panel"><div class="row head"><div>Prospect</div><div>Goal</div><div>Style</div><div>Status</div><div>Action</div></div><div id="list"><div class="loading">Loading prospects…</div></div></div><div class="drawer" id="drawer"></div></main><script>
const API_BASE='https://built-by-davila-backend.onrender.com',token=sessionStorage.getItem('bbd_token')||'';let data=[];const esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const headers={'Content-Type':'application/json',...(options.headers||{})};if(token)headers.Authorization=`Bearer ${token}`;const r=await fetch(API_BASE+path,{...options,headers});const body=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401)throw new Error('Your Studio session has expired. Return to Studio and sign in again.');throw new Error(body.error||`HTTP ${r.status}`)}return body}
function normalize(x){return{id:x.id,status:x.status,company:x.company,contact:x.contact,email:x.email,phone:x.phone,business:x.business,audience:x.audience,goal:x.goal,pages:Array.isArray(x.pages)?x.pages:[],cta:x.cta,musthave:x.musthave,style:x.style,colors:x.colors,inspiration:x.inspiration,avoid:x.avoid,existing:x.existing_website,domain:x.domain,logo:x.logo,photos:x.photos,services:x.services,competitors:x.competitors,timing:x.timing,budget:x.budget,notes:x.notes,draft:x.draft,draftGenerated:Boolean(x.draft_generated),submittedAt:x.submitted_at}}
function render(){document.getElementById('total').textContent=data.length;document.getElementById('new').textContent=data.filter(x=>x.status==='New Intake').length;document.getElementById('drafts').textContent=data.filter(x=>x.draftGenerated).length;const list=document.getElementById('list');if(!data.length){list.innerHTML='<div class="empty">No prospect intakes yet. Share the intake form with a prospect to start the workflow.</div>';return}list.innerHTML=data.map(x=>`<div class="row"><div><div class="name">${esc(x.company)}</div><div class="muted">${esc(x.contact)} • ${esc(x.email)}</div></div><div>${esc(x.goal||'—')}</div><div>${esc(x.style||'—')}</div><div><span class="pill ${x.draftGenerated?'draft':''}">${esc(x.status)}</span></div><div><button class="btn secondary" onclick="openProspect('${x.id}')">Open</button></div></div>`).join('')}
function firstUseful(text,fallback){const t=String(text||'').trim();return t&&t.length>3?t:fallback}
function goalHeadline(x){const name=x.company||'Your business';const map={'Generate leads':`${name} makes it easier for the right customers to take the next step.`,'Book appointments':`Make it simple to discover ${name} — and book the next conversation.`,'Sell products or services':`A clearer way to discover what ${name} can do for you.`,'Showcase work / portfolio':`See the work behind ${name}.`,'Build credibility':`${name}. Built on experience, trust, and results.`,'Replace an outdated website':`${name}, presented the way the business deserves.`};return map[x.goal]||`${name}, built to stand out.`}
function buildSections(x){const requested=(x.pages||[]).filter(Boolean);const base=['Home','About'];if(x.services&&x.services.trim())base.push('Services');requested.forEach(p=>{if(!base.includes(p))base.push(p)});if(!base.includes('Contact'))base.push('Contact');return base}
function generateDraft(x){const cta=firstUseful(x.cta,x.goal==='Book appointments'?'Book a Consultation':x.goal==='Generate leads'?'Request a Quote':'Get Started');const audience=firstUseful(x.audience,'prospective customers looking for a trusted provider');const business=firstUseful(x.business,`${x.company} provides professional products and services for its customers.`);const services=firstUseful(x.services,'Primary services and solutions');const headline=goalHeadline(x);const about=`${x.company} should be introduced with a concise credibility story: what the company does, who it serves, and why customers should trust it. Use the prospect's own language where possible, but tighten it into clear benefit-focused copy.`;const servicesIntro=`Present ${services} in scannable cards or sections, each focused on the customer problem, the solution, and the next action.`;const design=`${x.style||'Modern & clean'} visual direction${x.colors?` using ${x.colors}`:''}. Prioritize strong hierarchy, generous spacing, clear calls-to-action, and photography that feels specific to the business rather than generic.`;const content=`Write directly to ${audience}. Lead with outcomes and credibility, then explain services, proof, process, and a clear path to ${cta}.`;const proof=x.competitors?`Differentiate from competitors such as ${x.competitors} by emphasizing specific proof, responsiveness, expertise, and a clearer customer journey.`:'Add testimonials, project examples, credentials, years in business, or measurable proof wherever available.';return{headline,eyebrow:x.goal||'Professional website',sub:business,cta,sections:buildSections(x),createdAt:new Date().toISOString(),strategy:{audience,primaryGoal:x.goal||'Build credibility',conversion:`Primary conversion: ${cta}`,design,content,proof},copy:{about,servicesIntro,contact:`Close with a direct invitation to ${cta}. Keep the contact experience short and remove unnecessary friction.`},pagePlan:buildSections(x).map(p=>({page:p,purpose:p==='Home'?'Establish value quickly and move visitors toward the primary CTA.':p==='About'?'Build trust with the company story, experience, and differentiators.':p==='Services'?'Explain offerings in customer-focused language with clear next steps.':p==='Portfolio'?'Show proof through projects, results, images, or case studies.':p==='FAQ'?'Answer objections and common questions before they stop a conversion.':p==='Contact'?`Make it easy to ${cta} with minimal friction.`:`Support the main business goal and guide visitors toward ${cta}.`}))}}
window.openProspect=id=>{const x=data.find(p=>p.id===id);if(!x)return;const d=x.draft||null;document.getElementById('drawer').className='drawer on';document.getElementById('drawer').innerHTML=`<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><div class="eyebrow">PROSPECT INTAKE</div><h2 style="margin:5px 0">${esc(x.company)}</h2><div class="muted">Submitted ${new Date(x.submittedAt).toLocaleString()}</div></div><div class="actions"><button class="btn primary" onclick="makeDraft('${x.id}')">${d?'Regenerate Full Concept':'Generate Private Concept'}</button></div></div><div class="two" style="margin-top:16px"><div class="box"><strong>Business</strong><div class="muted" style="margin-top:6px">${esc(x.business||'—')}</div></div><div class="box"><strong>Ideal customer</strong><div class="muted" style="margin-top:6px">${esc(x.audience||'—')}</div></div><div class="box"><strong>Goal</strong><div class="muted" style="margin-top:6px">${esc(x.goal||'—')}</div></div><div class="box"><strong>Style</strong><div class="muted" style="margin-top:6px">${esc(x.style||'—')} • ${esc(x.colors||'No colors provided')}</div></div><div class="box"><strong>Services / products</strong><div class="muted" style="margin-top:6px">${esc(x.services||'—')}</div></div><div class="box"><strong>Budget & timing</strong><div class="muted" style="margin-top:6px">${esc(x.budget||'—')} • ${esc(x.timing||'—')}</div></div></div>${d?draftHtml(x,d):'<div class="empty">No private website concept generated yet.</div>'}`;document.getElementById('drawer').scrollIntoView({behavior:'smooth'})};
function draftHtml(x,d){const s=d.strategy||{},copy=d.copy||{},plan=Array.isArray(d.pagePlan)?d.pagePlan:[];return`<div class="draft"><div class="draft-hero"><div class="eyebrow" style="color:#ff735f">PRIVATE INTERNAL WEBSITE CONCEPT</div><div style="font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#bbb">${esc(d.eyebrow||x.goal||'Website concept')}</div><h2>${esc(d.headline)}</h2><p>${esc(d.sub)}</p><button class="btn primary">${esc(d.cta)}</button></div><div class="draft-section"><h3>Strategy Brief</h3><div class="concept-grid"><div class="concept-card"><strong>Audience</strong><div class="muted">${esc(s.audience||x.audience||'Target customer')}</div></div><div class="concept-card"><strong>Primary Goal</strong><div class="muted">${esc(s.primaryGoal||x.goal||'Build credibility')}</div></div><div class="concept-card"><strong>Conversion</strong><div class="muted">${esc(s.conversion||d.cta)}</div></div><div class="concept-card"><strong>Proof Strategy</strong><div class="muted">${esc(s.proof||'Use testimonials, credentials and real examples.')}</div></div></div></div><div class="draft-section"><h3>Suggested Sitemap</h3><div class="site-map">${(d.sections||[]).map(p=>`<span class="site-chip">${esc(p)}</span>`).join('')}</div>${plan.length?`<div style="margin-top:16px;display:grid;gap:9px">${plan.map(p=>`<div class="concept-card"><strong>${esc(p.page)}</strong><div class="muted">${esc(p.purpose)}</div></div>`).join('')}</div>`:''}</div><div class="draft-section"><h3>Homepage Copy Direction</h3><div class="copy-block"><div class="label">Hero headline</div><strong>${esc(d.headline)}</strong></div><div class="copy-block"><div class="label">Hero supporting copy</div>${esc(d.sub)}</div><div class="copy-block"><div class="label">Primary CTA</div><strong>${esc(d.cta)}</strong></div><div class="copy-block"><div class="label">About section direction</div>${esc(copy.about||'Build trust with a concise company story and differentiators.')}</div><div class="copy-block"><div class="label">Services section direction</div>${esc(copy.servicesIntro||'Explain services clearly and connect each one to a customer need.')}</div><div class="copy-block"><div class="label">Contact section direction</div>${esc(copy.contact||`End with a clear invitation to ${d.cta}.`)}</div></div><div class="draft-section"><h3>Design & Content Direction</h3><div class="concept-grid"><div class="concept-card"><strong>Visual direction</strong><div class="muted">${esc(s.design||x.style||'Modern & clean')}</div></div><div class="concept-card"><strong>Content direction</strong><div class="muted">${esc(s.content||`Focus on ${x.goal||'credibility'} and guide visitors toward ${d.cta}.`)}</div></div></div><div class="muted" style="margin-top:16px">Internal only. Nothing in this concept is visible to the prospect until you choose to share it.</div></div></div>`}
window.makeDraft=async id=>{const x=data.find(p=>p.id===id);if(!x)return;const draft=generateDraft(x);const button=document.querySelector(`button[onclick="makeDraft('${id}')"]`);if(button){button.disabled=true;button.textContent='Generating…'}try{const updated=await api('/api/prospects/'+id,{method:'PATCH',body:JSON.stringify({draft,draft_generated:true,status:'Draft Generated'})});const idx=data.findIndex(p=>p.id===id);data[idx]=normalize(updated);render();openProspect(id)}catch(e){alert(e.message);if(button){button.disabled=false;button.textContent=x.draft?'Regenerate Full Concept':'Generate Private Concept'}}};
async function load(){const list=document.getElementById('list');list.innerHTML='<div class="loading">Loading prospects…</div>';try{data=(await api('/api/prospects')).map(normalize);render()}catch(e){list.innerHTML=`<div class="error">${esc(e.message)}</div>`}}document.getElementById('refresh').onclick=load;load();
</script></body></html>
