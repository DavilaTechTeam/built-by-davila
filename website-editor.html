<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ef;color:#17191c;font:16px Inter,Arial,sans-serif}header{background:#111418;color:white;padding:25px max(24px,calc((100vw - 1050px)/2))}header strong{letter-spacing:.08em}main{max-width:1050px;margin:auto;padding:36px 24px}h1{font-size:32px;margin:0 0 10px}p{line-height:1.6;color:#60646b}.card{background:white;border:1px solid #e7e3dc;border-radius:18px;padding:24px;margin:22px 0}.head{display:flex;justify-content:space-between;gap:16px;align-items:center}.numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.numbers div{padding:16px;background:#f8f7f4;border-radius:12px}.numbers small{display:block;color:#646871;margin-bottom:8px}.numbers strong{font-size:23px}button{font:inherit;font-weight:700;border-radius:30px;padding:12px 20px;border:1px solid #e1dfdb;background:white;cursor:pointer}button.primary{background:#ff5a36;border-color:#ff5a36;color:white}button:disabled{opacity:.6;cursor:wait}.history{border-top:1px solid #eee;margin-top:20px;padding-top:16px}.history p{margin:8px 0}.badge{background:#f1f3f5;padding:7px 12px;border-radius:20px;font-size:13px}.backdrop{position:fixed;inset:0;background:#0007;backdrop-filter:blur(5px);display:none;padding:20px;overflow:auto;z-index:10}.backdrop.open{display:flex;align-items:flex-start;justify-content:center}.popup{background:#f5f3ef;border-radius:22px;max-width:850px;width:100%;margin:30px 0;padding:24px}.popup h2{margin:10px 0}.error{color:#b42318}#message{min-height:24px}@media(max-width:600px){.numbers{grid-template-columns:1fr}.head{align-items:flex-start}.popup{padding:16px}.numbers strong{font-size:21px}}
#website-fields label{display:block;font-weight:700;margin:20px 0 8px}#website-fields textarea{display:block;width:100%;margin-top:8px;min-height:90px;padding:14px;border:1px solid #dedbd4;border-radius:12px;background:#faf9f6;color:#17191c;font:400 16px/1.5 Inter,Arial,sans-serif;resize:vertical}#website-actions{margin-top:24px}#website-actions[hidden]{display:none}#website-reviews:empty{display:none}.portal-nav{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.portal-nav a{padding:10px 16px;border:1px solid #dedbd4;border-radius:30px;text-decoration:none;color:#17191c;font-size:14px;font-weight:700;background:#fff}.portal-nav a:hover{border-color:#ff5a36;color:#d33c19}.project-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:24px 0}.project-grid label,#project-files label{display:block;font-weight:700;font-size:14px}.project-grid textarea,.project-grid input,#file-category{display:block;width:100%;padding:12px;margin-top:8px;border:1px solid #dedbd4;border-radius:10px;background:#faf9f6;font:400 16px/1.5 Inter,Arial,sans-serif;color:#17191c}.project-grid textarea{min-height:95px;resize:vertical}#file-category{max-width:320px;margin-bottom:20px}#project-upload{display:block;margin:12px 0;width:100%}#project-files small{display:block;color:#60646b;line-height:1.5}.project-file{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;border-top:1px solid #eee}.project-file strong{overflow-wrap:anywhere}.project-file small{margin-top:5px}.project-file button{flex-shrink:0;font-size:14px;padding:9px 14px}.card,section{scroll-margin-top:24px}@media(max-width:600px){.project-grid{grid-template-columns:1fr}.portal-nav a{padding:9px 12px}.project-file{align-items:flex-start}}.editor-grid{display:grid;grid-template-columns:minmax(240px,340px) minmax(0,1fr);gap:24px}#website-fields:not(:empty){max-height:680px;overflow:auto;padding-right:12px}#website-fields select{width:100%;padding:12px;margin-top:8px;font:400 15px/1.5 Inter,Arial,sans-serif;border:1px solid #dedbd4;border-radius:10px;background:#faf9f6}#website-preview{width:100%;height:620px;border:1px solid #dedbd4;border-radius:12px;background:white}#website-preview-wrap[hidden]{display:none}#website-actions{display:flex;flex-wrap:wrap;gap:10px}@media(max-width:800px){.editor-grid{grid-template-columns:1fr}#website-fields:not(:empty){max-height:450px}#website-preview{height:480px}}</style><style>
body.website-editor-open main{max-width:1680px}
body.website-editor-open .editor-grid{grid-template-columns:minmax(260px,300px) minmax(0,1fr)}
body.website-editor-open #website-preview{height:75vh;min-height:620px}
.preview-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.preview-heading h3{margin:0}.preview-heading button{font-size:14px}
#website-preview-wrap.preview-expanded{position:fixed;inset:16px;z-index:1000;background:#faf9f6;border:1px solid #dedbd4;border-radius:18px;padding:20px;box-shadow:0 20px 80px #11141855;display:flex;flex-direction:column}
#website-preview-wrap.preview-expanded #website-preview{flex:1;min-height:0;height:100%}
body.preview-open{overflow:hidden}
@media(max-width:800px){body.website-editor-open .editor-grid{grid-template-columns:1fr}body.website-editor-open #website-preview{min-height:480px;height:70vh}#website-preview-wrap.preview-expanded{inset:8px;padding:14px}}
</style><style>main{max-width:1680px;padding-top:22px}#website-edits{margin-top:16px}#website-edits>p:first-of-type{max-width:1000px}.editor-grid{grid-template-columns:minmax(260px,300px) minmax(0,1fr)}#website-fields:not(:empty){max-height:75vh}#load-website{display:none}#website-preview{height:75vh;min-height:620px}.editor-back{color:white;text-decoration:none;font-weight:700}@media(max-width:800px){.editor-grid{grid-template-columns:1fr}}</style></head><body class="website-editor-open"><header class="site-header" style="display:flex;justify-content:space-between;align-items:center;gap:20px"><strong>BUILT BY DAVILA</strong><a class="editor-back" href="client-portal.html#website-edits">← Back to project</a></header><main><div class="head"><div><h1 id="company">Website editor</h1><p>Edit your wording and photos, then submit your changes for review.</p></div><button id="refresh">Refresh</button></div><p id="message" role="status"></p><section class="card" id="website-edits"><div class="head"><h2>Website edits</h2><button id="load-website">Open editor</button></div><p>Edit wording and replace photos using your project uploads. Preview your changes, then submit them for approval. Layout and styling stay protected.</p><p id="website-message" role="status"></p><div class="editor-grid"><div id="website-fields"></div><div id="website-preview-wrap" hidden><div class="preview-heading"><h3>Website preview</h3><button type="button" id="expand-website-preview" aria-expanded="false">⛶ <span>Full screen</span></button></div><iframe id="website-preview" title="Website preview" sandbox="" referrerpolicy="no-referrer"></iframe></div></div><div id="website-actions" hidden><button id="save-wording">Save draft</button> <button id="preview-wording">Preview changes</button> <button class="primary" id="submit-wording">Submit for approval</button></div><div id="website-reviews" class="history"></div></section></main><script type="text/plain" data-customer-script>
const base='https://built-by-davila-backend.onrender.com',el=id=>document.getElementById(id);
const access=sessionStorage.getItem('bbd_customer_access')||'';
if(access){sessionStorage.setItem('bbd_customer_access',access);history.replaceState(null,'',location.pathname+location.search);}
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n||0));
const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){
 const r=await fetch(base+path,{...options,headers:{'Content-Type':'application/json',Authorization:'Bearer '+access},signal:AbortSignal.timeout(75000)});
 const data=await r.json();if(!r.ok)throw new Error(data.error||'Unable to complete this request.');return data;
}
async function load(){if(!access){el('message').textContent='Please use the private customer link provided by Built By Davila.';return;}try{const d=await api('/customer-api/profile');el('company').textContent=d.company;el('message').textContent='';}catch(e){el('message').textContent=e.message;}}
let wordingFields=[],draftKey='',projectImages=[],photoPreparing=0;const preparedPhotos=new Map();
function imageOptions(field,files){return '<option value="'+field.value+'">Keep current image</option>'+files.filter(f=>['image/jpeg','image/png','image/webp'].includes(f.content_type)).map(f=>'<option value="'+esc(f.id)+'">'+esc(f.filename)+'</option>').join('');}

async function prepareEditorPhoto(field){
 const select=el(field.id),file=projectImages.find(f=>f.id===select.value);if(!file||Number(file.size_bytes)<=400*1024)return;
 photoPreparing++;select.disabled=true;for(const id of ['save-wording','preview-wording','submit-wording'])el(id).disabled=true;el('website-message').textContent='Preparing '+file.filename+' for your website…';
 try{
  if(!preparedPhotos.has(file.id))preparedPhotos.set(file.id,(async()=>{
   const response=await fetch(base+'/customer-api/uploads/'+file.id,{headers:{Authorization:'Bearer '+access},signal:AbortSignal.timeout(75000)});if(!response.ok)throw Error('Unable to load this project photo.');
   const bitmap=await createImageBitmap(await response.blob()),canvas=document.createElement('canvas');let width=Math.min(1600,bitmap.width),height=Math.round(width*bitmap.height/bitmap.width);if(height>1600){width=Math.round(width*1600/height);height=1600;}let blob;
   try{for(let pass=0;pass<8;pass++){canvas.width=Math.max(1,width);canvas.height=Math.max(1,height);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',.8));if(blob&&blob.size<=400*1024)break;width=Math.round(width*.75);height=Math.round(height*.75);}if(!blob||blob.size>400*1024)throw Error('Choose a smaller replacement photo.');}finally{bitmap.close();}
   const suffix={'image/webp':'webp','image/png':'png','image/jpeg':'jpg'}[blob.type];if(!suffix)throw Error('This browser could not prepare the photo. Try a smaller JPG or PNG.');const name=file.filename.replace(/\.[^.]+$/,'')+'-website.'+suffix;const upload=await fetch(base+'/customer-api/uploads',{method:'POST',headers:{'Content-Type':'application/octet-stream',Authorization:'Bearer '+access,'X-File-Name':encodeURIComponent(name),'X-File-Category':'Website content'},body:blob,signal:AbortSignal.timeout(120000)});const data=await upload.json();if(!upload.ok)throw Error(data.error||'Unable to prepare photo.');return {...data,content_type:blob.type};
  })());
  const ready=await preparedPhotos.get(file.id);if(!projectImages.some(f=>f.id===ready.id))projectImages.push(ready);const option=document.createElement('option');option.value=ready.id;option.textContent=ready.filename;select.append(option);select.value=ready.id;el('website-message').textContent='Photo ready. Preview your changes before submitting.';
 }catch(e){preparedPhotos.delete(file.id);select.value=field.value;el('website-message').textContent=e.message;}
 finally{photoPreparing--;select.disabled=false;if(!photoPreparing)for(const id of ['save-wording','preview-wording','submit-wording'])el(id).disabled=false;}
}

el('preview-wording').onclick=async()=>{const b=el('preview-wording');b.disabled=true;el('website-message').textContent='Preparing preview…';try{const d=await api('/customer-api/website/preview',{method:'POST',body:JSON.stringify({changes:draftChanges()})});el('website-preview').srcdoc=d.html;el('website-message').textContent='Preview updated. Submit for approval when ready.';}catch(e){el('website-message').textContent=e.message;}finally{b.disabled=false;}};
const draftChanges=()=>wordingFields.map(f=>({id:f.id,value:el(f.id).value,original:f.value})).filter((c,i)=>c.value.trim()!==wordingFields[i].value);

let previewPreviousFocus=null;
function setPreviewExpanded(expanded){
 const wrap=el('website-preview-wrap'),button=el('expand-website-preview');
 if(expanded)previewPreviousFocus=document.activeElement;
 wrap.classList.toggle('preview-expanded',expanded);document.body.classList.toggle('preview-open',expanded);
 button.setAttribute('aria-expanded',String(expanded));
 const spanish=document.documentElement.lang==='es';
 button.querySelector('span').textContent=expanded?(spanish?'Cerrar pantalla completa':'Exit full screen'):(spanish?'Pantalla completa':'Full screen');
 if(expanded)button.focus();else if(previewPreviousFocus?.isConnected)previewPreviousFocus.focus();
}
el('expand-website-preview').onclick=()=>setPreviewExpanded(!el('website-preview-wrap').classList.contains('preview-expanded'));
document.addEventListener('keydown',event=>{if(!el('website-preview-wrap').classList.contains('preview-expanded'))return;if(event.key==='Escape'){event.preventDefault();setPreviewExpanded(false);}else if(event.key==='Tab'){const button=el('expand-website-preview'),frame=el('website-preview');if(event.shiftKey&&document.activeElement===button){event.preventDefault();frame.focus();}else if(!event.shiftKey&&document.activeElement===frame){event.preventDefault();button.focus();}}});

el('load-website').onclick=async()=>{
 el('load-website').disabled=true;el('website-message').textContent='Loading your website editor…';
 try{
  const d=await api('/customer-api/website');
  if(!d.available){el('website-message').textContent='Website editing setup is pending. Please contact Built By Davila.';return;}
  wordingFields=d.fields;draftKey='bbd_wording_'+d.clientId;
  try{const legacy=localStorage.getItem('bbd_wording_'+access);if(legacy&&!localStorage.getItem(draftKey))localStorage.setItem(draftKey,legacy);localStorage.removeItem('bbd_wording_'+access);}catch{}
  let draft=[];try{draft=JSON.parse(localStorage.getItem(draftKey)||'[]')}catch{}
  const materials=await api('/customer-api/project');projectImages=materials.uploads;
  el('website-fields').innerHTML=d.fields.map(f=>['image','background'].includes(f.type)?'<label for="'+f.id+'">'+esc(f.label)+'<select id="'+f.id+'">'+imageOptions(f,materials.uploads)+'</select></label>':'<label for="'+f.id+'">'+esc(f.label)+'<textarea id="'+f.id+'" maxlength="4000">'+esc(draft.find(c=>c.id===f.id)?.value??f.value)+'</textarea></label>').join('');
  for(const f of d.fields.filter(f=>['image','background'].includes(f.type))){const saved=draft.find(c=>c.id===f.id);if(saved&&[...el(f.id).options].some(o=>o.value===saved.value))el(f.id).value=saved.value;}
  el('website-fields').insertAdjacentHTML('beforeend','<p>Choose a JPG, PNG, or WebP from Project files. Larger photos are prepared automatically. Up to five replacements per review.</p>');
  for(const field of d.fields.filter(f=>['image','background'].includes(f.type)))el(field.id).onchange=()=>prepareEditorPhoto(field);
  document.body.classList.add('website-editor-open');el('website-preview-wrap').hidden=false;el('website-preview').srcdoc=d.previewHtml;
  el('website-actions').hidden=false;
  el('website-reviews').innerHTML='<strong>Review history</strong>'+d.reviews.map(r=>'<p>'+esc(r.status)+' · '+new Date(r.submitted_at).toLocaleDateString()+(r.published_at?' · Published':'')+(r.review_note?' · '+esc(r.review_note):'')+'</p>').join('');
  el('website-message').textContent=draft.length?'Your saved draft is restored.':'Edit the fields below. Your website layout stays protected.';
 }catch(e){el('website-message').textContent=e.message;}
 finally{el('load-website').disabled=false;}
};
el('save-wording').onclick=()=>{try{localStorage.setItem(draftKey,JSON.stringify(draftChanges()));el('website-message').textContent='Draft saved in this browser.';}catch{el('website-message').textContent='Unable to save a draft in this browser. You can still submit for approval.';}};
el('submit-wording').onclick=async()=>{
 const button=el('submit-wording');button.disabled=true;
 try{await api('/customer-api/website/reviews',{method:'POST',body:JSON.stringify({changes:draftChanges()})});try{localStorage.removeItem(draftKey)}catch{}await el('load-website').onclick();el('website-message').textContent='Submitted for approval. Built By Davila will review your changes before publishing.';}
 catch(e){el('website-message').textContent=e.message;}finally{button.disabled=false;}
};


el('refresh').onclick=async()=>{await load();if(access)await el('load-website').onclick();};
(async()=>{await load();if(access)await el('load-website').onclick();})();
</script><script src="language.js?v=20261007-editor-page" defer></script></body></html>
