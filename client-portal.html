<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Client Portal | Built by Davila</title>
  <link rel="stylesheet" href="studio.css">
</head>
<body>
  <main class="main" style="margin-left:0;max-width:1100px;margin-inline:auto;padding:40px 24px;">
    <div class="topbar">
      <div>
        <div class="eyebrow">BUILT BY DAVILA</div>
        <h1>Client Portal</h1>
        <div class="studio-welcome">Review and manage your website content.</div>
      </div>
      <div class="top-actions">
        <a class="btn secondary" href="studio.html">Back to Studio</a>
      </div>
    </div>

    <section class="panel">
      <div class="panel-heading">
        <div>
          <div class="eyebrow">CLIENT EXPERIENCE</div>
          <h3>Website Management</h3>
        </div>
      </div>

      <div class="cards">
        <div class="metric"><span>Website</span><strong>Preview</strong></div>
        <div class="metric"><span>Content</span><strong>Edit Text</strong></div>
        <div class="metric"><span>Media</span><strong>Change Photos</strong></div>
        <div class="metric"><span>Changes</span><strong>Save & Review</strong></div>
      </div>

      <div class="notice compact" style="margin-top:20px;">
        Initial portal shell is live. Next we will connect each client to their own secure login and website.
      </div>
    </section>
  </main>
</body>
</html>
