<!doctype html>
<html lang="en">
<head>
<style id="admin-lock">body{visibility:hidden}</style>
<script src="admin-access.js" defer></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Visual Editor | Built by Davila</title><link rel="stylesheet" href="studio.css">
<style>body{background:#f4f4f1}.shell{max-width:1450px;margin:0 auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}.canvas{background:#fff;border:1px solid #ddd;border-radius:18px;overflow:hidden}.bar{height:50px;border-bottom:1px solid #ddd;padding:0 14px;display:flex;align-items:center;justify-content:space-between}.stage{height:720px;padding:18px;background:#e9e9e5}.stage iframe{width:100%;height:100%;border:0;background:#fff}.inspector{background:#fff;border:1px solid #ddd;border-radius:18px;padding:18px;align-self:start}.muted{font-size:12px;color:#667085}.hint{font-size:13px;color:#667085;line-height:1.45}.field textarea{width:100%;min-height:150px;border:1px solid #d9dce1;border-radius:10px;padding:10px;font:inherit}.hidden{display:none}.notice{margin-top:12px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#fff1cc;font-size:11px;font-weight:800}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.managed-note{font-size:11px;color:#667085;margin-top:4px}@media(max-width:1000px){.grid{grid-template-columns:1fr}}</style>
</head><body><main class="shell"><div class="top"><div><div class="eyebrow">BUILT BY DAVILA • VISUAL EDITOR</div><h1 id="client-name" style="margin:4px 0">Client Website</h1><div class="muted" id="site-url"></div><div class="managed-note" id="managed-note"></div></div><div class="toolbar"><a class="btn secondary" href="portal-clients.html">Back to Client Portals</a><a class="btn secondary" id="open-site" href="#" target="_blank" rel="noopener">Open Website</a><button class="btn secondary" id="save-btn">Save Draft</button><button class="btn primary" id="submit-btn">Submit for Review</button></div></div><div class="grid"><section class="canvas"><div class="bar"><span class="muted">Safe draft mode</span><span class="pill" id="mode-pill">Loading…</span></div><div class="stage"><iframe id="frame" title="Client website preview"></iframe></div></section><aside class="inspector"><div id="empty"><h3>Select something to edit</h3><p class="hint">Hover and click text on supported Built by Davila sites. Layout and styling remain locked.</p></div><div id="text-editor" class="hidden"><div class="eyebrow">TEXT SELECTED</div><h3 id="label">Editable Text</h3><div class="field"><textarea id="value"></textarea></div><div class="toolbar"><button class="btn secondary" id="cancel">Cancel</button><button class="btn primary" id="apply">Apply</button></div></div><div class="notice compact" id="origin-note"></div></aside></div></main><script type="text/plain" data-admin-script>
const API_BASE='https://built-by-davila-backend.onrender.com',CONFIG_KEY='bbd_portal_configs_v2',params=new URLSearchParams(location.search),clientId=params.get('client'),configs=JSON.parse(localStorage.getItem(CONFIG_KEY)||'{}'),cfg=configs[clientId],frame=document.getElementById('frame');let selected=null,patches=JSON.parse(localStorage.getItem('bbd_portal_draft_'+clientId)||'[]');
function normalizeUrl(v=''){const s=String(v).trim();if(!s)return'';return /^https?:\/\//i.test(s)?s:'https://'+s.replace(/^\/+/, '')}
function managedSourceFor(url=''){let host='';try{host=new URL(normalizeUrl(url)).hostname.toLowerCase().replace(/^www\./,'')}catch{}if(host==='translateservices.com')return{api:'https://api.github.com/repos/DavilaTechTeam/davila-website/contents/index.html?ref=main',repo:'https://github.com/DavilaTechTeam/davila-website',assetBase:'https://www.translateservices.com/'};return null}
function prepareManagedHtml(html,base){const origin=base.replace(/\/$/,'');html=html.replace(/\s+integrity=(['"]).*?\1/gi,'');html=html.replace(/(src|href|action)=(['"])\/(?!\/)/gi,(m,a,q)=>`${a}=${q}${origin}/`);html=html.replace(/url\((['"]?)\/(?!\/)/gi,(m,q)=>`url(${q}${origin}/`);const baseTag=`<base href="${base}">`;return /<head[^>]*>/i.test(html)?html.replace(/<head([^>]*)>/i,`<head$1>${baseTag}`):baseTag+html}
function decodeBase64Utf8(s=''){const clean=s.replace(/\s/g,'');const bytes=Uint8Array.from(atob(clean),c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
function toast(t){alert(t)} function save(){localStorage.setItem('bbd_portal_draft_'+clientId,JSON.stringify(patches))} function selectorFor(el){if(el.id)return '#'+el.id;const p=[];let c=el;while(c&&c!==frame.contentDocument.body&&p.length<5){let s=c.tagName.toLowerCase();const parent=c.parentElement;if(parent){const same=[...parent.children].filter(x=>x.tagName===c.tagName);if(same.length>1)s+=`:nth-of-type(${same.indexOf(c)+1})`}p.unshift(s);c=parent}return p.join(' > ')} function applyPatches(doc){patches.forEach(p=>{try{const e=doc.querySelector(p.selector);if(e)e.textContent=p.value}catch{}})} function bind(){let doc;try{doc=frame.contentDocument;if(!doc||!doc.body)throw 0}catch{document.getElementById('mode-pill').textContent='Preview Only';document.getElementById('origin-note').textContent='This website is on a different domain, so browser security allows previewing it but not direct click-to-edit.';return}document.getElementById('mode-pill').textContent='Editing Enabled';document.getElementById('origin-note').textContent='You are editing a safe Built by Davila working copy. The live website stays unchanged until changes are reviewed and published.';applyPatches(doc);doc.addEventListener('mouseover',e=>{if(/^(H1|H2|H3|H4|H5|H6|P|A|BUTTON)$/.test(e.target.tagName)){e.target.style.outline='2px dashed #ff4f38';e.target.style.outlineOffset='3px'}},true);doc.addEventListener('mouseout',e=>{if(e.target!==selected){e.target.style.outline='';e.target.style.outlineOffset=''}},true);doc.addEventListener('click',e=>{if(!/^(H1|H2|H3|H4|H5|H6|P|A|BUTTON)$/.test(e.target.tagName))return;e.preventDefault();e.stopPropagation();if(selected){selected.style.outline='';selected.style.outlineOffset=''}selected=e.target;selected.style.outline='3px solid #ff4f38';selected.style.outlineOffset='3px';document.getElementById('empty').classList.add('hidden');document.getElementById('text-editor').classList.remove('hidden');document.getElementById('label').textContent=e.target.tagName==='H1'?'Page Headline':/^H[2-6]$/.test(e.target.tagName)?'Section Heading':e.target.tagName==='P'?'Paragraph Text':'Button / Link Text';document.getElementById('value').value=e.target.textContent.trim()},true)}
async function loadSite(){if(!cfg){document.getElementById('client-name').textContent='Portal configuration not found';document.getElementById('site-url').textContent='Return to Client Portals and set up this client first.';document.getElementById('mode-pill').textContent='Not Configured';document.getElementById('open-site').style.display='none';return}const normalized=normalizeUrl(cfg.url);if(normalized&&normalized!==cfg.url){cfg.url=normalized;configs[clientId]=cfg;localStorage.setItem(CONFIG_KEY,JSON.stringify(configs))}document.getElementById('client-name').textContent=cfg.clientName||'Client Website';document.getElementById('site-url').textContent=normalized;document.getElementById('open-site').href=normalized;const managed=managedSourceFor(normalized);if(managed){document.getElementById('managed-note').textContent='Managed source: DavilaTechTeam/davila-website • Live domain remains '+new URL(normalized).hostname;document.getElementById('mode-pill').textContent='Loading Managed Copy…';try{const r=await fetch(managed.api,{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});if(!r.ok)throw new Error('Could not load managed source');const data=await r.json();const html=decodeBase64Utf8(data.content||'');if(!html)throw new Error('Managed source was empty');frame.srcdoc=prepareManagedHtml(html,managed.assetBase);frame.addEventListener('load',bind,{once:true});return}catch(e){document.getElementById('origin-note').textContent='Could not load the managed editing copy. Falling back to live-site preview.'}}frame.src=normalized;frame.addEventListener('load',bind,{once:true})}
loadSite();
document.getElementById('apply').onclick=()=>{if(!selected)return;const value=document.getElementById('value').value,selector=selectorFor(selected);selected.textContent=value;const i=patches.findIndex(p=>p.selector===selector);if(i>=0)patches[i]={type:'text',selector,value,label:document.getElementById('label').textContent};else patches.push({type:'text',selector,value,label:document.getElementById('label').textContent});save();document.getElementById('text-editor').classList.add('hidden');document.getElementById('empty').classList.remove('hidden')};document.getElementById('cancel').onclick=()=>{document.getElementById('text-editor').classList.add('hidden');document.getElementById('empty').classList.remove('hidden')};document.getElementById('save-btn').onclick=()=>{save();toast('Draft saved. Live site unchanged.')};document.getElementById('submit-btn').onclick=async()=>{if(!cfg||!patches.length)return toast('Make at least one change first.');try{const r=await fetch(API_BASE+'/portal-api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({client_key:String(clientId),client_name:cfg.clientName,site_url:normalizeUrl(cfg.url),changes:patches})});if(!r.ok)throw 0;toast('Submitted for review.')}catch{toast('Could not submit review right now.')}};
</script><script src="language.js?v=1" defer></script>
</body></html>
