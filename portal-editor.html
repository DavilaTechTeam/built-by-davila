<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Visual Editor | Built by Davila</title><link rel="stylesheet" href="studio.css">
<style>body{background:#f4f4f1}.shell{max-width:1450px;margin:0 auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}.canvas{background:#fff;border:1px solid #ddd;border-radius:18px;overflow:hidden}.bar{height:50px;border-bottom:1px solid #ddd;padding:0 14px;display:flex;align-items:center;justify-content:space-between}.stage{height:720px;padding:18px;background:#e9e9e5}.stage iframe{width:100%;height:100%;border:0;background:#fff}.inspector{background:#fff;border:1px solid #ddd;border-radius:18px;padding:18px;align-self:start}.muted{font-size:12px;color:#667085}.hint{font-size:13px;color:#667085;line-height:1.45}.field textarea{width:100%;min-height:150px;border:1px solid #d9dce1;border-radius:10px;padding:10px;font:inherit}.hidden{display:none}.notice{margin-top:12px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#fff1cc;font-size:11px;font-weight:800}.toolbar{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:1000px){.grid{grid-template-columns:1fr}}</style>
</head><body><main class="shell"><div class="top"><div><div class="eyebrow">BUILT BY DAVILA • VISUAL EDITOR</div><h1 id="client-name" style="margin:4px 0">Client Website</h1><div class="muted" id="site-url"></div></div><div class="toolbar"><a class="btn secondary" href="portal-clients.html">Back to Client Portals</a><a class="btn secondary" id="open-site" target="_blank" rel="noopener" style="display:none">Open Website</a><button class="btn secondary" id="save-btn">Save Draft</button><button class="btn primary" id="submit-btn">Submit for Review</button></div></div><div class="grid"><section class="canvas"><div class="bar"><span class="muted">Safe draft mode</span><span class="pill" id="mode-pill">Loading…</span></div><div class="stage"><iframe id="frame" title="Client website preview"></iframe></div></section><aside class="inspector"><div id="empty"><h3>Select something to edit</h3><p class="hint">Hover and click text on supported Built by Davila sites. Layout and styling remain locked.</p></div><div id="text-editor" class="hidden"><div class="eyebrow">TEXT SELECTED</div><h3 id="label">Editable Text</h3><div class="field"><textarea id="value"></textarea></div><div class="toolbar"><button class="btn secondary" id="cancel">Cancel</button><button class="btn primary" id="apply">Apply</button></div></div><div class="notice compact" id="origin-note"></div></aside></div></main><script>
const API_BASE='https://built-by-davila-backend.onrender.com',CONFIG_KEY='bbd_portal_configs_v2',params=new URLSearchParams(location.search),clientId=params.get('client'),configs=JSON.parse(localStorage.getItem(CONFIG_KEY)||'{}'),cfg=configs[clientId],frame=document.getElementById('frame');let selected=null,patches=JSON.parse(localStorage.getItem('bbd_portal_draft_'+clientId)||'[]');
function normalizeUrl(v=''){let s=String(v||'').trim();if(!s)return'';if(!/^https?:\/\//i.test(s))s='https://'+s.replace(/^\/+/, '');try{return new URL(s).href}catch{return s}}
function sameOrigin(url){try{return new URL(url).origin===location.origin}catch{return false}}
function toast(t){alert(t)} function save(){localStorage.setItem('bbd_portal_draft_'+clientId,JSON.stringify(patches))} function selectorFor(el){if(el.id)return '#'+el.id;const p=[];let c=el;while(c&&c!==frame.contentDocument.body&&p.length<5){let s=c.tagName.toLowerCase();const parent=c.parentElement;if(parent){const same=[...parent.children].filter(x=>x.tagName===c.tagName);if(same.length>1)s+=`:nth-of-type(${same.indexOf(c)+1})`}p.unshift(s);c=parent}return p.join(' > ')} function applyPatches(doc){patches.forEach(p=>{try{const e=doc.querySelector(p.selector);if(e)e.textContent=p.value}catch{}})} function bind(){const current=normalizeUrl(cfg?.url||'');if(!sameOrigin(current)){document.getElementById('mode-pill').textContent='Preview Only';document.getElementById('origin-note').textContent='This live website is on a different domain. You can preview it here, but direct click-to-edit is disabled by browser security. Use Open Website to view the live site.';return}let doc;try{doc=frame.contentDocument;if(!doc||!doc.body)throw 0}catch{document.getElementById('mode-pill').textContent='Preview Only';document.getElementById('origin-note').textContent='This website can be previewed, but direct click-to-edit is unavailable.';return}document.getElementById('mode-pill').textContent='Editing Enabled';document.getElementById('origin-note').textContent='Click-to-edit is enabled for this Built by Davila site.';applyPatches(doc);doc.addEventListener('mouseover',e=>{if(/^(H1|H2|H3|H4|H5|H6|P|A|BUTTON)$/.test(e.target.tagName)){e.target.style.outline='2px dashed #ff4f38';e.target.style.outlineOffset='3px'}},true);doc.addEventListener('mouseout',e=>{if(e.target!==selected){e.target.style.outline='';e.target.style.outlineOffset=''}},true);doc.addEventListener('click',e=>{if(!/^(H1|H2|H3|H4|H5|H6|P|A|BUTTON)$/.test(e.target.tagName))return;e.preventDefault();e.stopPropagation();if(selected){selected.style.outline='';selected.style.outlineOffset=''}selected=e.target;selected.style.outline='3px solid #ff4f38';selected.style.outlineOffset='3px';document.getElementById('empty').classList.add('hidden');document.getElementById('text-editor').classList.remove('hidden');document.getElementById('label').textContent=e.target.tagName==='H1'?'Page Headline':/^H[2-6]$/.test(e.target.tagName)?'Section Heading':e.target.tagName==='P'?'Paragraph Text':'Button / Link Text';document.getElementById('value').value=e.target.textContent.trim()},true)}
if(!cfg){document.getElementById('client-name').textContent='Portal configuration not found';document.getElementById('site-url').textContent='Return to Client Portals and set up this client first.';document.getElementById('mode-pill').textContent='Not Configured'}else{const normalized=normalizeUrl(cfg.url);cfg.url=normalized;configs[clientId]=cfg;localStorage.setItem(CONFIG_KEY,JSON.stringify(configs));document.getElementById('client-name').textContent=cfg.clientName||'Client Website';document.getElementById('site-url').textContent=normalized;const openSite=document.getElementById('open-site');openSite.href=normalized;openSite.style.display='inline-flex';frame.src=normalized;frame.addEventListener('load',bind);if(!sameOrigin(normalized)){document.getElementById('mode-pill').textContent='Preview Only';document.getElementById('origin-note').textContent='Loading external website preview…'}}
document.getElementById('apply').onclick=()=>{if(!selected)return;const value=document.getElementById('value').value,selector=selectorFor(selected);selected.textContent=value;const i=patches.findIndex(p=>p.selector===selector);if(i>=0)patches[i]={type:'text',selector,value,label:document.getElementById('label').textContent};else patches.push({type:'text',selector,value,label:document.getElementById('label').textContent});save();document.getElementById('text-editor').classList.add('hidden');document.getElementById('empty').classList.remove('hidden')};document.getElementById('cancel').onclick=()=>{document.getElementById('text-editor').classList.add('hidden');document.getElementById('empty').classList.remove('hidden')};document.getElementById('save-btn').onclick=()=>{save();toast('Draft saved. Live site unchanged.')};document.getElementById('submit-btn').onclick=async()=>{if(!cfg||!patches.length)return toast('Make at least one change first.');try{const r=await fetch(API_BASE+'/portal-api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({client_key:String(clientId),client_name:cfg.clientName,site_url:normalizeUrl(cfg.url),changes:patches})});if(!r.ok)throw 0;toast('Submitted for review.')}catch{toast('Could not submit review right now.')}};
</script></body></html>
