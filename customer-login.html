<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Customer sign-in | Built by Davila</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f3ef;color:#17191c;font:16px Arial,sans-serif}header{background:#111418;color:white;padding:26px 24px;letter-spacing:.08em}main{max-width:480px;margin:60px auto;padding:30px;background:white;border:1px solid #e7e3dc;border-radius:20px}h1{font-size:30px}p{line-height:1.5;color:#60646b}label{display:block;font-weight:bold;margin:22px 0 8px}input{width:100%;padding:14px;border:1px solid #dedbd4;border-radius:10px;font:inherit}button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:30px;background:#ff5a36;color:white;font:700 16px Arial;cursor:pointer}button:disabled{opacity:.6}#message{color:#b42318}a{color:#b7381c}@media(max-width:520px){main{margin:30px 16px}}</style></head>
<body><header><span style="display:inline-flex;align-items:center;gap:12px"><img src="assets/built-by-davila-mark-v2.svg" alt="" style="width:52px;height:42px;object-fit:contain;background:white;border-radius:6px;padding:4px"><strong>BUILT BY DAVILA</strong></span></header><main><h1 id="title">Customer sign-in</h1><p id="description">Sign in to your project with your email and password.</p><form id="login"><label for="email">Email</label><input id="email" type="email" required autocomplete="username" maxlength="254"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password" maxlength="256"><button id="submit">Sign in</button><p id="message" role="status" aria-live="polite"></p></form><p>Need access or forgot your password? <a href="index.html#contact">Contact Built by Davila</a> for a new setup/reset invitation.</p></main><script src="customer-login.js" defer></script></body></html>
