<!doctype html>
<html lang="en"><head>
<style id="admin-lock">body{visibility:hidden}</style>
<script src="admin-access.js" defer></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Drafts | Built by Davila</title><link rel="stylesheet" href="studio.css"><style>
body{background:#f5f5f2}.wrap{max-width:1180px;margin:auto;padding:36px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.panel{margin-top:22px;background:#fff;border:1px solid #e5e5e2;border-radius:18px;overflow:hidden}.row{display:grid;grid-template-columns:1.5fr 1fr .8fr auto;gap:14px;align-items:center;padding:16px 18px;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.head{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;color:#667085}.name{font-weight:900}.muted{font-size:12px;color:#667085;margin-top:3px}.empty{padding:32px;text-align:center;color:#667085}
.editor-shell{max-width:1500px;margin:auto;padding:20px}.editor-top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.editor-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}.browser{background:#fff;border:1px solid #ddd;border-radius:18px;overflow:hidden;box-shadow:0 14px 38px rgba(0,0,0,.08)}.browserbar{padding:10px 14px;background:#f6f6f3;border-bottom:1px solid #e4e4df;font-size:11px;color:#667085}.site-nav{display:flex;justify-content:space-between;padding:22px 30px;border-bottom:1px solid #eee}.site-logo{font-size:22px;font-weight:900}.site-links{display:flex;gap:18px;font-size:12px}.hero{padding:80px 36px;background:linear-gradient(135deg,#111,#2b2b2b);color:#fff}.hero h1{font-size:52px;line-height:1.02;max-width:820px;margin:10px 0 16px}.hero p{max-width:720px;color:#ddd;line-height:1.7}.eyebrow{font-size:11px;letter-spacing:.1em;font-weight:900;color:#ff5a40;text-transform:uppercase}.cta{display:inline-block;margin-top:16px;background:#ff543b;color:#fff;border-radius:999px;padding:12px 18px;font-weight:900}.section{padding:50px 36px}.section.alt{background:#f7f7f4}.section h2{font-size:32px;margin:8px 0 12px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.card{border:1px solid #e4e4df;border-radius:14px;padding:18px}.sidebar{background:#fff;border:1px solid #ddd;border-radius:18px;padding:18px;height:max-content;position:sticky;top:16px}.sidebar textarea,.sidebar input{width:100%;box-sizing:border-box;border:1px solid #d9d9d4;border-radius:10px;padding:10px;font:inherit}.sidebar textarea{min-height:120px}.editable{outline:2px solid transparent;outline-offset:5px;cursor:pointer}.editable:hover,.editable.active{outline-color:#ff543b}.state{margin-top:12px;background:#f6f6f2;padding:10px;border-radius:10px;font-size:12px;color:#667085}.notice{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:700;margin-bottom:14px}@media(max-width:900px){.editor-grid{grid-template-columns:1fr}.sidebar{position:static}.cards{grid-template-columns:1fr}.site-links{display:none}.hero h1{font-size:38px}}@media(max-width:760px){.row{grid-template-columns:1fr}.head{display:none}.top{flex-direction:column}}
</style></head><body><div id="app"></div><script type="text/plain" data-admin-script>
const API='https://built-by-davila-backend.onrender.com';const token=sessionStorage.getItem('bbd_token')||'';const qs=new URLSearchParams(location.search);const editId=qs.get('edit');const esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const h={'Content-Type':'application/json',...(options.headers||{})};if(token)h.Authorization=`Bearer ${token}`;const r=await fetch(API+path,{...options,headers:h});const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||`HTTP ${r.status}`);return b}
function listPage(){document.getElementById('app').innerHTML=`<main class="wrap"><div class="top"><div><div class="eyebrow">BUILT BY DAVILA • PRIVATE DRAFTS</div><h1 style="margin:5px 0">Website Drafts</h1><div class="studio-welcome">Open and refine actual private website drafts before anything is shown to a prospect.</div></div><div style="display:flex;gap:8px"><a class="btn secondary" href="prospects.html">Prospects</a><a class="btn secondary" href="studio.html">Studio</a></div></div><div class="panel"><div class="row head"><div>Prospect / Client</div><div>Goal</div><div>Status</div><div>Action</div></div><div id="list"><div class="empty">Loading drafts…</div></div></div></main>`;loadList()}
async function loadList(){const el=document.getElementById('list');try{const all=await api('/api/prospects');const drafts=all.filter(x=>x.draft_generated||x.draft);if(!drafts.length){el.innerHTML='<div class="empty">No website drafts yet. Generate a private concept from Prospects first.</div>';return}el.innerHTML=drafts.map(x=>`<div class="row"><div><div class="name">${esc(x.company)}</div><div class="muted">${esc(x.contact||'')} ${x.email?'• '+esc(x.email):''}</div></div><div>${esc(x.goal||'—')}</div><div>${esc(x.status||'Draft')}</div><div><a class="btn primary" href="drafts.html?edit=${encodeURIComponent(x.id)}&v=2">Open Website Draft</a></div></div>`).join('')}catch(e){el.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
let prospect,draft,dirty=false,selected='';
function defaults(x){const d=x.draft||{};return{...d,eyebrow:d.eyebrow||x.goal||'Professional website',headline:d.headline||`${x.company}, built to stand out.`,sub:d.sub||x.business||`${x.company} provides professional services for its customers.`,cta:d.cta||'Get Started',sections:Array.isArray(d.sections)&&d.sections.length?d.sections:['Home','About','Services','Contact'],servicesHeading:d.servicesHeading||(x.services?'Services built around your needs':'A clearer way to understand what we offer'),services:Array.isArray(d.services)&&d.services.length?d.services:String(x.services||'').split(/[\n,;]+/).map(s=>s.trim()).filter(s=>s.length>2).slice(0,3),copy:{...(d.copy||{}),about:(d.copy&&d.copy.about)||`${x.company} should be introduced with a concise credibility story focused on experience, trust, and what makes the business different.`,contact:(d.copy&&d.copy.contact)||'Make it easy for visitors to take the next step.'},contactHeading:d.contactHeading||d.cta||'Get Started'}}
function editorPage(){document.getElementById('app').innerHTML=`<main class="editor-shell"><div class="editor-top"><div><div class="eyebrow">BUILT BY DAVILA • PRIVATE DRAFT</div><h2 id="top-company" style="margin:4px 0">Loading…</h2></div><div style="display:flex;gap:8px"><a class="btn secondary" href="drafts.html">Back to Drafts</a><button class="btn primary" id="save">Save Draft</button></div></div><div class="notice">Internal only. This draft is not published or shared with the prospect.</div><div class="editor-grid"><div class="browser"><div class="browserbar" id="address">private-draft</div><div class="site-nav"><div class="site-logo" id="site-company"></div><div class="site-links" id="site-links"></div></div><section class="hero"><div class="eyebrow editable" data-key="eyebrow" id="v-eyebrow"></div><h1 class="editable" data-key="headline" id="v-headline"></h1><p class="editable" data-key="sub" id="v-sub"></p><span class="cta editable" data-key="cta" id="v-cta"></span></section><section class="section"><div class="eyebrow">WHAT WE DO</div><h2 class="editable" data-key="servicesHeading" id="v-servicesHeading"></h2><div class="cards" id="service-cards"></div></section><section class="section alt"><div class="eyebrow">ABOUT</div><h2>Why <span id="about-company"></span></h2><p class="editable" data-key="about" id="v-about"></p></section><section class="section"><div class="eyebrow">NEXT STEP</div><h2 class="editable" data-key="contactHeading" id="v-contactHeading"></h2><p class="editable" data-key="contact" id="v-contact"></p><span class="cta editable" data-key="cta" id="v-cta2"></span></section></div><aside class="sidebar"><div class="eyebrow">DRAFT EDITOR</div><h3 id="edit-title">Select something to edit</h3><p class="muted">Click any outlined text in the website.</p><div id="edit-fields"></div><div class="state" id="state">No unsaved changes.</div></aside></div></main>`;document.getElementById('save').onclick=saveDraft;loadEditor()}
async function loadEditor(){try{prospect=await api('/api/prospects/'+editId);draft=defaults(prospect);renderEditor()}catch(e){document.getElementById('app').innerHTML=`<div style="padding:40px">${esc(e.message)}</div>`}}
function renderEditor(){document.getElementById('top-company').textContent=prospect.company;document.getElementById('site-company').textContent=prospect.company;document.getElementById('about-company').textContent=prospect.company;document.getElementById('address').textContent=`private-draft / ${prospect.company}`;document.getElementById('site-links').innerHTML=(draft.sections||[]).filter(x=>x!=='Home').slice(0,5).map(x=>`<span>${esc(x)}</span>`).join('');['eyebrow','headline','sub','cta','servicesHeading','contactHeading'].forEach(k=>{const el=document.getElementById('v-'+k);if(el)el.textContent=draft[k]||''});document.getElementById('v-cta2').textContent=draft.cta||'';document.getElementById('v-about').textContent=draft.copy.about||'';document.getElementById('v-contact').textContent=draft.copy.contact||'';let s=draft.services||[];if(!s.length)s=['Core Service','Customer Solution','Professional Support'];draft.services=s;document.getElementById('service-cards').innerHTML=s.map((v,i)=>`<div class="card editable" data-service="${i}"><strong>${esc(v)}</strong><p class="muted">Benefit-focused service description.</p></div>`).join('');document.querySelectorAll('.editable').forEach(el=>el.onclick=e=>{e.stopPropagation();document.querySelectorAll('.editable').forEach(x=>x.classList.remove('active'));el.classList.add('active');if(el.dataset.service!==undefined)editService(Number(el.dataset.service));else editKey(el.dataset.key)})}
function markDirty(){dirty=true;document.getElementById('state').textContent='Unsaved changes.'}
function editKey(key){selected=key;const val=key==='about'?draft.copy.about:key==='contact'?draft.copy.contact:draft[key]||'';const labels={eyebrow:'Hero eyebrow',headline:'Hero headline',sub:'Hero supporting copy',cta:'Button text',servicesHeading:'Services heading',about:'About copy',contactHeading:'Contact heading',contact:'Contact copy'};document.getElementById('edit-title').textContent=labels[key]||'Edit';document.getElementById('edit-fields').innerHTML=`<textarea id="edit-value">${esc(val)}</textarea><button class="btn primary" style="width:100%;margin-top:10px" id="apply">Apply</button>`;document.getElementById('apply').onclick=()=>{const v=document.getElementById('edit-value').value;if(key==='about'||key==='contact')draft.copy[key]=v;else draft[key]=v;markDirty();renderEditor();editKey(key)}}
function editService(i){document.getElementById('edit-title').textContent=`Service ${i+1}`;document.getElementById('edit-fields').innerHTML=`<input id="edit-value" value="${esc(draft.services[i]||'')}"><button class="btn primary" style="width:100%;margin-top:10px" id="apply">Apply</button>`;document.getElementById('apply').onclick=()=>{draft.services[i]=document.getElementById('edit-value').value;markDirty();renderEditor();editService(i)}}
async function saveDraft(){const btn=document.getElementById('save');btn.disabled=true;btn.textContent='Saving…';try{const updated=await api('/api/prospects/'+editId,{method:'PATCH',body:JSON.stringify({draft,draft_generated:true,status:prospect.status==='Converted to Client'?'Converted to Client':'Draft Generated'})});prospect=updated;draft=defaults(updated);dirty=false;renderEditor();document.getElementById('state').textContent='Saved to Built by Davila database.'}catch(e){document.getElementById('state').textContent=e.message}finally{btn.disabled=false;btn.textContent='Save Draft'}}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});if(editId)editorPage();else listPage();
</script></body></html>
