<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Drafts | Built by Davila</title><link rel="stylesheet" href="studio.css"><style>body{background:#f5f5f2}.wrap{max-width:1180px;margin:auto;padding:36px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.panel{margin-top:22px;background:#fff;border:1px solid #e5e5e2;border-radius:18px;overflow:hidden}.row{display:grid;grid-template-columns:1.5fr 1fr .8fr auto;gap:14px;align-items:center;padding:16px 18px;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.head{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;color:#667085}.name{font-weight:900}.muted{font-size:12px;color:#667085;margin-top:3px}.empty{padding:32px;text-align:center;color:#667085}@media(max-width:760px){.row{grid-template-columns:1fr}.head{display:none}.top{flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><div class="eyebrow">BUILT BY DAVILA • PRIVATE DRAFTS</div><h1 style="margin:5px 0">Website Drafts</h1><div class="studio-welcome">Open and refine actual private website drafts before anything is shown to a prospect.</div></div><div style="display:flex;gap:8px"><a class="btn secondary" href="prospects.html">Prospects</a><a class="btn secondary" href="studio.html">Studio</a></div></div><div class="panel"><div class="row head"><div>Prospect / Client</div><div>Goal</div><div>Status</div><div>Action</div></div><div id="list"><div class="empty">Loading drafts…</div></div></div></main><script>const API='https://built-by-davila-backend.onrender.com';const token=sessionStorage.getItem('bbd_token')||'';const esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path){const h={};if(token)h.Authorization=`Bearer ${token}`;const r=await fetch(API+path,{headers:h});const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||`HTTP ${r.status}`);return b}(async()=>{const el=document.getElementById('list');try{const all=await api('/api/prospects');const drafts=all.filter(x=>x.draft_generated||x.draft);if(!drafts.length){el.innerHTML='<div class="empty">No website drafts yet. Generate a private concept from Prospects first.</div>';return}el.innerHTML=drafts.map(x=>`<div class="row"><div><div class="name">${esc(x.company)}</div><div class="muted">${esc(x.contact||'')} ${x.email?'• '+esc(x.email):''}</div></div><div>${esc(x.goal||'—')}</div><div>${esc(x.status||'Draft')}</div><div><a class="btn primary" href="prospect-draft.html?id=${encodeURIComponent(x.id)}">Open Website Draft</a></div></div>`).join('')}catch(e){el.innerHTML=`<div class="empty">${esc(e.message)}</div>`}})();</script></body></html>
